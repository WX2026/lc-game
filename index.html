<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>露出系统</title>
<style>
:root{--bg:#f7f7f7;--card:#fff;--text:#222;--muted:#888;--border:#e0e0e0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.65;min-height:100vh;font-size:15px}
.screen{display:none;min-height:100vh;padding:12px 14px 30px;max-width:640px;margin:0 auto}
.screen.active{display:block}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 0 12px;font-size:14px;border-bottom:1px solid var(--border);margin-bottom:12px}
.top-bar .left,.top-bar .right{display:flex;gap:14px}
.top-bar span{cursor:pointer;user-select:none}
.top-bar span:active{opacity:.5}
.time-loc{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:14px;color:#444;padding-left:8px;border-left:3px solid #ccc}
.time-loc .loc{text-align:right;max-width:40%;font-weight:500}
.plot-area{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;min-height:280px;max-height:52vh;overflow-y:auto;white-space:pre-wrap;margin-bottom:16px;line-height:1.8;font-size:15px}
.plot-area.streaming::after{content:"▋";animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.choices{margin-bottom:12px}
.choice-item{padding:10px 0;border-left:3px solid #ccc;padding-left:10px;margin-bottom:6px;cursor:pointer;font-size:15px}
.choice-item:active{background:#f0f0f0}
.input-box{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:15px;margin-bottom:10px;background:#fff;resize:none;min-height:44px}
.btn{display:inline-block;padding:10px 18px;border:1px solid #333;border-radius:6px;background:#333;color:#fff;font-size:14px;cursor:pointer;margin-right:8px;margin-bottom:8px}
.btn:active{opacity:.7}
.btn-outline{background:#fff;color:#333}
.btn-block{display:block;width:100%;text-align:center;margin-bottom:10px}
.btn-regen{background:#fff;color:#c00;border-color:#c00}
.btn-random{background:#fff;color:#007aff;border-color:#007aff;font-size:12px;padding:4px 8px;margin-left:8px;border-radius:4px}
.panel-title{text-align:center;font-size:18px;font-weight:600;margin:10px 0 18px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#fff;border-radius:10px;padding:20px;width:90%;max-width:360px;max-height:80vh;overflow-y:auto}
.modal h3{margin-bottom:14px;text-align:center}
.save-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:6px;font-size:14px;z-index:200;max-width:85%;text-align:center}
.hidden{display:none!important}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:13px;color:#666;margin-bottom:4px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:15px}
.start-title{text-align:center;font-size:28px;font-weight:700;margin:60px 0 10px;letter-spacing:2px}
.start-sub{text-align:center;color:var(--muted);margin-bottom:50px;font-size:14px}
.buy-btn{padding:4px 12px;border:1px solid #333;background:#fff;border-radius:4px;cursor:pointer;font-size:13px}
.shop-btn{padding:4px 8px;border:1px solid #4CAF50;background:#fff;color:#4CAF50;border-radius:4px;cursor:pointer;font-size:12px;margin-left:6px}
.shop-btn:disabled{opacity:0.5;cursor:not-allowed}
.shop-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee}
.shop-name{font-weight:500}
.shop-price{color:#4CAF50;font-weight:600;min-width:60px;text-align:right}
.shop-desc{color:#666;font-size:12px;margin-top:2px}
.loading{opacity:0.5;pointer-events:none}
.form-row-with-random{display:flex;align-items:center;gap:10px}
.form-row-with-random input,.form-row-with-random select,.form-row-with-random textarea{flex:1}
</style>
</head>
<body>

<div id="screen-start" class="screen active">
  <div class="start-title">露出系统</div>
  <div class="start-sub">文字冒险 · 触屏操作</div>
  <button class="btn btn-block" onclick="openSaveModal()">继续任务</button>
  <button class="btn btn-block btn-outline" onclick="showScreen('screen-create')">重新开始</button>
  <button class="btn btn-block btn-outline" onclick="showScreen('screen-settings')">API设置</button>
  <button class="btn btn-block btn-outline" onclick="showScreen('screen-shop')">系统商店</button>
</div>

<div id="screen-create" class="screen">
  <div class="panel-title">角色创建</div>
  <div class="form-row-with-random">
    <label>性别</label>
    <select id="c-gender">
      <option>男</option>
      <option>女</option>
      <option>其他</option>
    </select>
    <button class="btn-random" onclick="randomizeGender()">随机</button>
  </div>
  <div class="form-row-with-random">
    <label>姓名</label>
    <input id="c-name" type="text" placeholder="主角姓名">
    <button class="btn-random" onclick="randomizeName()">随机</button>
  </div>
  <div class="form-row-with-random">
    <label>年龄（≥18）</label>
    <input id="c-age" type="number" min="18" max="60" value="22">
    <button class="btn-random" onclick="randomizeAge()">随机</button>
  </div>
  <div class="form-row-with-random">
    <label>职业</label>
    <input id="c-job" type="text" placeholder="大学生 / 白领 / 自由职业等">
    <button class="btn-random" onclick="randomizeJob()">随机</button>
  </div>
  <div class="form-row-with-random">
    <label>外貌</label>
    <textarea id="c-look" placeholder="身高体型、脸型发型、特殊特征..." style="min-height:70px"></textarea>
    <button class="btn-random" onclick="randomizeAppearance()">随机</button>
  </div>
  <div class="form-row-with-random">
    <label>性格</label>
    <textarea id="c-pers" placeholder="表面冷静内心渴望刺激..." style="min-height:60px"></textarea>
    <button class="btn-random" onclick="randomizePersonality()">随机</button>
  </div>
  <div class="form-row-with-random">
    <label>补充信息</label>
    <textarea id="c-extra" placeholder="居住环境、人际关系、癖好等" style="min-height:60px"></textarea>
    <button class="btn-random" onclick="randomizeExtra()">随机</button>
  </div>
  <div class="form-row-with-random">
    <label>难度</label>
    <select id="c-diff">
      <option value="easy">简单</option>
      <option value="normal" selected>普通</option>
      <option value="hard">困难</option>
    </select>
    <button class="btn-random" onclick="randomizeDifficulty()">随机</button>
  </div>
  <div class="form-row-with-random">
    <label>初始地点</label>
    <select id="c-loc">
      <option value="寝室">寝室</option>
      <option value="家中卧室">家中卧室</option>
      <option value="教室">教室</option>
      <option value="图书馆">图书馆</option>
      <option value="便利店">便利店</option>
      <option value="公园">公园</option>
      <option value="地铁">地铁</option>
      <option value="商场">商场</option>
      <option value="电影院">电影院</option>
      <option value="custom">自定义...</option>
    </select>
    <button class="btn-random" onclick="randomizeLocation()">随机</button>
  </div>
  <div class="form-row hidden" id="custom-loc-row"><label>自定义地点</label><input id="c-loc-custom" type="text" placeholder="例如：公司办公室"></div>
  <div class="form-row-with-random">
    <label>开场剧情提示（可选）</label>
    <textarea id="c-opening" placeholder="例如：刚洗完澡只穿浴袍，系统突然激活..." style="min-height:60px"></textarea>
    <button class="btn-random" onclick="randomizeOpening()">随机</button>
  </div>
  <button class="btn btn-block" onclick="startGame()">激活露出系统</button>
  <button class="btn btn-outline btn-block" onclick="showScreen('screen-start')">返回</button>
</div>

<div id="screen-main" class="screen">
  <div class="top-bar">
    <div class="left">
      <span onclick="backToStart()">返回</span>
      <span onclick="openModifyModal()">修改角色</span>
    </div>
    <div class="right">
      <span onclick="quickSave()">保存</span>
      <span onclick="openSaveModal()">存档</span>
      <span onclick="showScreen('screen-settings')">API设置</span>
      <span onclick="showScreen('screen-shop')">商店</span>
    </div>
  </div>
  <div class="time-loc">
    <div id="time-str">----年-月-日 周- --:--</div>
    <div class="loc" id="loc-str">地点</div>
  </div>
  <div class="plot-area" id="plot-area">等待剧情生成...</div>
  <div class="choices" id="choices-area"></div>
  <textarea class="input-box" id="custom-input" placeholder="输入自定义剧情走向..."></textarea>
  <button class="btn" onclick="submitCustom()">提交自定义</button>
  <button class="btn btn-regen" onclick="regeneratePlot()">刷新剧情</button>
</div>

<div id="screen-settings" class="screen">
  <div class="top-bar"><div class="left"><span onclick="showScreen(game.started?'screen-main':'screen-start')">返回</span></div></div>
  <div class="panel-title">API 设置</div>
  <div class="form-row"><label>API Base URL</label><input id="api-base" type="text" placeholder="https://api.openai.com/v1"></div>
  <div class="form-row"><label>API Key</label><input id="api-key" type="password" placeholder="sk-..."></div>
  <div class="form-row"><label>模型名称</label><input id="api-model" type="text" placeholder="gpt-4o-mini / deepseek-chat 等"></div>
  <button class="btn btn-block" onclick="saveApi()">保存设置</button>
</div>

<div id="screen-shop" class="screen">
  <div class="top-bar"><div class="left"><span onclick="showScreen('screen-main')">返回</span></div></div>
  <div class="panel-title">系统商店</div>
  <div style="text-align:center;margin-bottom:16px">
    <div style="font-size:16px;font-weight:600;color:#333">系统余额: <span id="shop-currency">0</span> 币</div>
    <div style="font-size:14px;color:#666;margin-top:4px">每日任务可赚取更多系统币</div>
  </div>
  <div id="shop-items"></div>
  <div style="margin-top:20px;padding-top:12px;border-top:1px solid #eee">
    <div class="panel-title" style="font-size:16px">我的背包</div>
    <div id="inventory-list" style="color:#666;text-align:center;padding:12px">背包为空</div>
  </div>
</div>

<div id="save-modal" class="modal-bg hidden">
  <div class="modal">
    <h3>存档管理</h3>
    <div id="save-list"></div>
    <button class="btn btn-block" style="margin-top:12px" onclick="createNewSave()">新建存档</button>
    <button class="btn btn-outline btn-block" onclick="closeSaveModal()">关闭</button>
  </div>
</div>

<div id="modify-modal" class="modal-bg hidden">
  <div class="modal">
    <h3>修改角色信息</h3>
    <div class="form-row"><label>角色名称</label><input id="modify-name" type="text"></div>
    <div class="form-row"><label>年龄</label><input id="modify-age" type="number" min="18" max="60"></div>
    <div class="form-row"><label>职业</label><input id="modify-job" type="text"></div>
    <div class="form-row"><label>外貌</label><textarea id="modify-look" style="min-height:60px"></textarea></div>
    <div class="form-row"><label>性格</label><textarea id="modify-pers" style="min-height:60px"></textarea></div>
    <div class="form-row"><label>补充信息</label><textarea id="modify-extra" style="min-height:60px"></textarea></div>
    <div class="form-row"><label>难度</label>
      <select id="modify-diff">
        <option value="easy">简单</option>
        <option value="normal">普通</option>
        <option value="hard">困难</option>
      </select>
    </div>
    <div class="form-row"><label>当前地点</label><input id="modify-loc" type="text"></div>
    <button class="btn btn-block" onclick="saveModify()">保存修改</button>
    <button class="btn btn-outline btn-block" onclick="closeModifyModal()">取消</button>
  </div>
</div>

  buttons.forEach(btn => {
    btn.style.opacity = enabled ? '1' : '0.5';
    btn.style.pointerEvents = enabled ? 'auto' : 'none';

  const textareas = document.querySelectorAll('#custom-input');
  textareas.forEach(ta => {
    ta.disabled = !enabled;

}

// 根据当前地点修正任务名称
function correctTaskTitle(title, currentLocation) {
  let correctedTitle = title;
  
  // 为不同地点添加更合适的描述
  if (currentLocation === '寝室') {
    correctedTitle = correctedTitle
      .replace(/家里/g, '寝室')
      .replace(/家中/g, '宿舍')
      .replace(/房间/g, '寝室');
  } else if (currentLocation === '家中卧室') {
    // 保持家庭相关词汇
    correctedTitle = correctedTitle
      .replace(/寝室/g, '卧室')
      .replace(/宿舍/g, '家里');
  } else if (currentLocation === '教室') {
    correctedTitle = correctedTitle
      .replace(/家里/g, '教室')
      .replace(/寝室/g, '教室')
      .replace(/房间/g, '课堂');
  }
  
  return correctedTitle;
}

// 计算被发现概率
function calculateDetectionChance(exposureLevel, npcAlertness = 0) {
  const settings = DIFFICULTY_SETTINGS[game.difficulty] || DIFFICULTY_SETTINGS.normal;
  let baseChance = settings.detectionChanceBase;
  
  // 根据暴露程度调整概率
  if (exposureLevel === 'partial') baseChance *= 0.5;
  else if (exposureLevel === 'moderate') baseChance *= 1.0;
  else if (exposureLevel === 'full') baseChance *= 1.8;
  
  // NPC警觉度影响
  baseChance += (npcAlertness * 0.01);
  
  // 隐蔽度影响（默认70%会降低被发现概率）
  const concealmentFactor = (100 - game.concealment) / 100;
  baseChance *= (1 + concealmentFactor);
  
  // 环境因素：不同地点被发现概率不同
  const locationFactor = {
    '寝室': 0.7,
    '家中卧室': 0.6,
    '教室': 1.0,
    '图书馆': 1.2,
    '便利店': 1.3,
    '公园': 1.0,
    '地铁': 1.8,
    '商场': 1.5,
    '电影院': 0.9
  }[game.location] || 1.0;
  
  baseChance *= locationFactor;
  
  // 最终概率限制在合理范围
  return Math.max(0.01, Math.min(0.95, baseChance));
}

// 渲染商店物品
function renderShopItems() {
  const container = document.getElementById('shop-items');
  const items = SHOP_ITEMS.map(item => {
    const canBuy = game.currency >= item.price;
    const alreadyOwned = game.inventory.some(inv => inv.id === item.id && !inv.used);
    const isEquipment = item.type === 'equipment';
    const isClothing = item.type === 'clothing';
    
    // 如果是服装，检查是否已装备类似服装
    let shouldShowBuy = true;
    if (isClothing) {
      const sameTypeOwned = game.inventory.some(inv => {
        const shopItem = SHOP_ITEMS.find(si => si.id === inv.id);
        return shopItem && shopItem.type === 'clothing' && !inv.used;
      });
      // 允许拥有多件服装，但提示是否要替换
      shouldShowBuy = true;
    }
    
    return `
      <div class="shop-row">
        <div style="flex:1">
          <div class="shop-name">${item.name}</div>
          <div class="shop-desc">${item.desc}</div>
          <div style="font-size:11px;color:#FF4081;margin-top:2px">
            ${item.effect?.exposureBonus ? `暴露+${item.effect.exposureBonus} ` : ''}
            ${item.effect?.arousalBonus ? `快感+${item.effect.arousalBonus} ` : ''}
            ${item.effect?.dangerBonus ? `危险+${item.effect.dangerBonus} ` : ''}
          </div>
        </div>
        <div class="shop-price">${item.price}币</div>
        <button class="shop-btn" onclick="buyItem(${item.id})" 
                ${!canBuy ? 'disabled' : ''}>
          ${canBuy ? (alreadyOwned && isEquipment ? '已拥有' : (alreadyOwned && isClothing ? '再购' : '购买')) : '余额不足'}
        </button>
      </div>
    `;
  }).join('');
  
  container.innerHTML = items;
}

// 渲染背包
function renderInventory() {
  const container = document.getElementById('inventory-list');
  const items = game.inventory.filter(item => !item.used);
  
  if (items.length === 0) {
    container.innerHTML = '<div style="color:#666;text-align:center;padding:12px">背包为空</div>';
    return;
  }
  
  container.innerHTML = items.map(item => {

    return `
      <div class="shop-row" style="padding:6px 0;border-bottom:1px solid #eee">
        <div style="flex:1">

        </div>
        ${item.type === 'consumable' ? `<button class="shop-btn" onclick="useItem(${item.id})">使用</button>` : ''}
        ${item.type === 'clothing' ? `<button class="shop-btn" onclick="equipClothing(${item.id})">穿上</button>` : ''}
        ${item.type === 'tool' ? `<button class="shop-btn" onclick="useTool(${item.id})">使用</button>` : ''}

  }).join('');

// 购买物品
function buyItem(itemId) {
  const item = SHOP_ITEMS.find(i => i.id === itemId);
  if (!item) return;
  
  if (game.currency < item.price) {
    toast('余额不足');
    return;
  }
  
  // 不限制购买数量，但服装会有特殊处理
  game.currency -= item.price;
  game.inventory.push({
    id: item.id,
    name: item.name,
    type: item.type,
    used: false,
    equipped: false
  });
  
  // 如果是服装类型，自动装备
  if (item.type === 'clothing' && item.effect?.clothing) {
    game.clothing = item.effect.clothing;
    toast(`装备了${item.name}！`);
  }
  
  // 如果是情趣用品，添加到特殊状态
  if (item.type === 'tool' && item.effect?.specialStatus) {
    game.specialStatus = item.effect.specialStatus;
  }
  
  // 更新显示
  updateCurrencyDisplay(); // 更新余额显示
  renderShopItems();
  renderInventory();
  toast(`购买了${item.name}！`);
  quickSave();
}

// 使用物品
function useItem(itemId) {
  const invIndex = game.inventory.findIndex(item => item.id === itemId && !item.used);
  if (invIndex === -1) return;
  
  const shopItem = SHOP_ITEMS.find(i => i.id === itemId);
  if (!shopItem) return;
  
  // 应用效果
  if (shopItem.effect) {
    Object.keys(shopItem.effect).forEach(key => {
      if (key === 'stamina') {
        game.stamina = Math.min(100, game.stamina + shopItem.effect[key]);
      } else if (key === 'pee') {
        game.pee = Math.max(0, game.pee + shopItem.effect[key]);
      } else if (key === 'level') {
        game.level += shopItem.effect[key];
        game.currency += 60;
        updateCurrencyDisplay(); // 更新余额显示
        toast(`升级至 Lv.${game.level}！`);
      } else {
        game[key] = shopItem.effect[key];
      }
    });
  }
  
  // 标记为已使用
  if (shopItem.type === 'consumable') {
    game.inventory[invIndex].used = true;
  }
  
  renderInventory();
  toast(`使用了${shopItem.name}！效果已生效。`);
  quickSave();
}

// 装备服装
function equipClothing(itemId) {
  const invIndex = game.inventory.findIndex(item => item.id === itemId);
  if (invIndex === -1) return;
  
  const shopItem = SHOP_ITEMS.find(i => i.id === itemId);
  if (!shopItem || shopItem.type !== 'clothing') return;
  
  // 装备这件服装
  if (shopItem.effect?.clothing) {
    game.clothing = shopItem.effect.clothing;
    game.inventory[invIndex].equipped = true;
    
    // 如果有暴露加成，应用到游戏中
    if (shopItem.effect?.exposureBonus) {
      // 这里可以添加暴露度加成的数值影响
      toast(`穿上了${shopItem.name}，露出的胆量增加了！`);
    }
  }
  
  quickSave();
  showScreen('screen-main');
}

// 使用情趣用品
function useTool(itemId) {
  const invIndex = game.inventory.findIndex(item => item.id === itemId && !item.used);
  if (invIndex === -1) return;
  
  const shopItem = SHOP_ITEMS.find(i => i.id === itemId);
  if (!shopItem || shopItem.type !== 'tool') return;
  
  // 应用工具效果
  if (shopItem.effect?.specialStatus) {
    game.specialStatus = shopItem.effect.specialStatus;
  }
  
  if (shopItem.effect?.arousalBonus) {
    // 快感加成可以影响剧情生成
    toast(`使用了${shopItem.name}，身体变得更加敏感了！`);
  }
  
  // 工具可以重复使用，不标记为已使用
  quickSave();
  showScreen('screen-main');
}

// 根据主角性别和地点智能生成NPC性别
function initNpcs(){
  const surnames = ['林','苏','陈','顾','沈','温','叶','夏','白','陆','江','许','贺','傅','裴'];
  const givenM = ['清野','予安','景行','予舟','知许','景深','予白','清和','景明','予怀'];
  const givenF = ['晚晴','知夏','清欢','予安','景惜','晚宁','清野','予怀','知予','景微'];
  const relations = ['对门邻居','楼下便利店店员','同楼住户','偶尔碰面的同事','公司前辈','社团学长/学姐','健身房常客','咖啡店店员','快递站工作人员','小区保安'];
  const looksM = ['短发干净利落，戴细框眼镜，气质清冷','身高偏高，笑容温和，穿着整洁','微卷头发，眼神锐利，常穿深色衣服','斯文白净，说话轻声，显得礼貌','运动型身材，皮肤微晒，活力十足'];
  const looksF = ['短发戴细框眼镜，气质清冷','长直发，皮肤白皙，常穿宽松衣服','微卷长发，笑容甜美，妆容淡雅','高马尾，眼神明亮，穿着干练','空气刘海，声音轻柔，气质温柔'];
  const personalities = ['表面冷淡，观察力极强','热情但不越界，喜欢聊天','活泼爱八卦，好奇心重','沉默寡言，但记性很好','温和有礼，容易心软','直率敢言，对反常行为敏感','慢热型，熟悉后会很照顾人'];
  
  game.npcs = [];
  
  // 第一个NPC生成逻辑（关键修改点）
  // 如果是寝室环境，根据主角性别决定室友性别
  const firstNpcRelation = '舍友'; // 假定第一个是室友
  
  // 根据当前地点决定室友生成逻辑
  let firstNpcGender = '男'; // 默认男性
  
  if (game.location === '寝室' || game.location === '宿舍') {
    // 寝室环境，90%几率生成同性室友
    if (game.char.gender === '男') {
      firstNpcGender = '男'; // 男生寝室只产生男性舍友
    } else if (game.char.gender === '女') {
      firstNpcGender = '女'; // 女生寝室只产生女性舍友
    } else {
      // 其他性别情况，50%几率生成男女
      firstNpcGender = Math.random() > 0.5 ? '男' : '女';
    }
  } else {
    // 非寝室环境，根据主角性别有一定倾向性
    if (game.char.gender === '男') {
      firstNpcGender = Math.random() > 0.3 ? '男' : '女'; // 70%同性，30%异性
    } else if (game.char.gender === '女') {
      firstNpcGender = Math.random() > 0.3 ? '女' : '男'; // 70%同性，30%异性
    } else {
      firstNpcGender = Math.random() > 0.5 ? '男' : '女';
    }
  }
  
  // 生成第一个NPC（室友/合租者）
  game.npcs.push({
    id: 'n1',
    name: surnames[Math.floor(Math.random()*surnames.length)] + 
          (firstNpcGender === '女' ? givenF[Math.floor(Math.random()*givenF.length)] : 
                                    givenM[Math.floor(Math.random()*givenM.length)]),
    gender: firstNpcGender, 
    age: randInt(18, 25),
    relation: firstNpcRelation,
    look: firstNpcGender === '女' ? looksF[Math.floor(Math.random()*looksF.length)] : 
                                   looksM[Math.floor(Math.random()*looksM.length)],
    personality: personalities[Math.floor(Math.random()*personalities.length)], 
    alert: 0
  });
  
  // 生成剩余NPC（2-3个）
  const remainingNpcs = Math.random() > 0.5 ? 2 : 1;
  
  for(let i = 0; i < remainingNpcs; i++){
    const gender = Math.random() > 0.5 ? '女' : '男';
    game.npcs.push({
      id: 'n'+(i+2),
      name: rand(surnames) + (gender === '女' ? rand(givenF) : rand(givenM)),
      gender, 
      age: randInt(20, 32),
      relation: rand(relations),
      look: gender === '女' ? rand(looksF) : rand(looksM),
      personality: rand(personalities), 
      alert: 0
    });
  }
  
  console.log(`生成${game.npcs.length}个NPC，主角性别：${game.char.gender}，第一个NPC性别：${game.npcs[0].gender}，地点：${game.location}`);
}

// 完全重写的任务生成系统，专注于暴露裸露身体部位
function genDailyTasks(){
  // 根据难度获取配置
  const difficultyConfig = DIFFICULTY_SETTINGS[game.difficulty] || DIFFICULTY_SETTINGS.normal;

  mainTask.risk = Math.round(mainTask.risk * config.punishmentMultiplier);
  
  // 任务状态初始化
  mainTask.completed = false;
  mainTask.isMain = true;
  
  // 修正任务名称中的地点词汇
  mainTask.title = correctTaskTitle(mainTask.title, game.location);
  
  // 构建支线任务候选池（略低于主线难度）
  let sideTaskPool = taskPool.filter(t =>

  const sideCount = randInt(1, 2);
  const selected = [];
  const usedTitles = new Set([mainTask.title]);
  
  for(let i = 0; i < Math.min(sideCount, sideTaskPool.length); i++){
    const shuffled = [...sideTaskPool].sort(() => Math.random() - 0.5);
    for(const t of shuffled){
      const correctedTitle = correctTaskTitle(t.title, game.location);
      if(!usedTitles.has(correctedTitle)){

        const sideTask = {...t};
        sideTask.reward = Math.round(sideTask.reward * 0.7);
        sideTask.risk = Math.round(sideTask.risk * 0.9);
        sideTask.completed = false;
        sideTask.isMain = false;
        sideTask.title = correctedTitle;
        selected.push(sideTask);
        usedTitles.add(correctedTitle);
        break;
      }
    }
  }

  game.tasks.main = mainTask;
  game.tasks.side = selected;
  
  console.log(`第${game.day}天任务已生成：主线1个，支线${selected.length}个，当前地点：${game.location}，难度：${game.difficulty}`);

async function callStream(system, user){
  // 取消之前的请求
  if(currentRequestController){
    currentRequestController.abort();
    currentRequestController = null;
  }

  const cfg = getApi();
  if(!cfg.base || !cfg.key || !cfg.model){ 
    toast('请先配置API'); 
    return null; 
  }
  
  const messages = [{role:'system', content:system}];
  game.history.slice(-MAX_HISTORY).forEach(h => {
    messages.push({role:'user', content:h.user});
    messages.push({role:'assistant', content:h.assistant});
  });
  messages.push({role:'user', content:user});
  
  try{
    currentRequestController = new AbortController();
    const timeoutId = setTimeout(() => {
      if(currentRequestController){
        currentRequestController.abort();
        currentRequestController = null;
        toast('请求超时（60秒），请重试');
        setUIEnabled(true);
      }
    }, game.apiTimeout);

    // 禁用UI并显示加载状态
    setUIEnabled(false);
    
    const res = await fetch(cfg.base.replace(/\/$/,'') + '/chat/completions', {
      method:'POST',
      headers:{
        'Content-Type':'application/json', 
        'Authorization':'Bearer ' + cfg.key,
        'Accept': 'text/event-stream'
      },
      body: JSON.stringify({
        model:cfg.model, 
        stream:true, 
        temperature:0.9,  // 提高随机性，增强创新
        top_p:0.95,        // 增加多样性
        frequency_penalty:0.3, // 适当减少重复
        presence_penalty:0.3,  // 鼓励新内容
        max_tokens:4000,   // 增加最大令牌数以容纳详细描写
        messages
      }),
      signal: currentRequestController.signal
    });
    
    clearTimeout(timeoutId);
    
    if(!res.ok){ 
      const errorText = await res.text();
      console.error('API错误:', res.status, errorText);
      toast('API错误 ' + res.status); 
      setUIEnabled(true);
      currentRequestController = null;
      return null; 
    }
    
    return res.body.getReader();
  }catch(e){
    if(e.name === 'AbortError'){
      console.log('请求被取消');
    }else{
      console.error('网络连接失败:', e);
      toast('网络连接失败，请检查API设置');
    }
    setUIEnabled(true);
    currentRequestController = null;
    return null;
  }
}

async function streamPlot(reader){
  const el = document.getElementById('plot-area');
  el.classList.add('streaming');
  el.textContent = '剧情正在生成中...';
  let full = '';
  let buffer = '';
  const decoder = new TextDecoder();
  let lastUpdate = Date.now();
  
  try{
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      
      buffer += decoder.decode(value, {stream:true});
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      
      for(const line of lines){
        if(!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if(data === '[DONE]') continue;
        
        try{
          const delta = JSON.parse(data).choices?.[0]?.delta?.content || '';
          if(delta){
            full += delta;
            
            // 限制更新频率以提高性能
            const now = Date.now();
            if(now - lastUpdate > 100 || full.length < 2000){
              el.textContent = full.replace(/【状态】[^\n]*/g, '').trim();
              el.scrollTop = el.scrollHeight;
              lastUpdate = now;
            }
          }
        }catch(e){
          console.warn('解析JSON失败:', e);
        }
      }
    }
    
    // 处理最后剩余缓冲
    if(buffer.startsWith('data: ')){
      try{
        const data = buffer.slice(6).trim();
        if(data !== '[DONE]'){
          const delta = JSON.parse(data).choices?.[0]?.delta?.content || '';
          if(delta) full += delta;
        }
      }catch(e){
        console.warn('处理最后缓冲失败:', e);
      }
    }
  } catch(e){
    console.error('流式读取失败:', e);
    toast('剧情生成出错');
  } finally {
    el.classList.remove('streaming');
    const displayText = full.replace(/【状态】[^\n]*/g, '').trim();
    el.textContent = displayText || '剧情生成失败，请重试';
    setUIEnabled(true); // 重新启用UI
    currentRequestController = null;
  }
  
  return full;
}

function parseAndUpdate(full){
  // 提取选项并去重
  let choices = [];
  const reList = [
    /【选项\s*(\d)\s*】\s*([^\n【]+)/g,
    /选项\s*(\d)\s*[:：]\s*([^\n]+)/g
  ];
  for(const re of reList){
    let m;
    while((m = re.exec(full)) !== null){
      const t = m[2].trim();
      if(t && !choices.some(c => c.slice(0,10) === t.slice(0,10))) choices.push(t);
    }
    if(choices.length >= 3) break;
  }
  choices = choices.slice(0,3);
  const fallbacks = ['大胆推进当前主线任务','谨慎观察周围NPC反应并调整策略','先处理身体状态或与在场NPC简短互动'];
  while(choices.length < 3){
    const fb = fallbacks[choices.length];
    if(!choices.includes(fb)) choices.push(fb); else break;
  }

  // 解析状态
  const stateMatch = full.match(/【状态】([^\n]+)/);
  if(stateMatch){
    stateMatch[1].split('|').forEach(p => {
      const [k, v] = (p.split('=') || []).map(s => s && s.trim());
      if(!k || !v) return;
      if(k === '地点') game.location = v;
      if(k === '衣物') game.clothing = v;
      if(k === '特殊状态') game.specialStatus = v;
      if(k === '异常感知') game.awareness = v;
      if(k === '体力变化') game.stamina = Math.max(0, Math.min(100, game.stamina + (parseInt(v)||0)));
      if(k === '尿意变化') game.pee = Math.max(0, Math.min(100, game.pee + (parseInt(v)||0)));
      if(k === '危险变化') game.danger = Math.max(0, Math.min(100, game.danger + (parseInt(v)||0)));
      if(k === '系统币变化' || k === '金钱变化') {
        const change = parseInt(v) || 0;
        game.currency = Math.max(0, game.currency + change);
        // 立即更新商店余额显示
        updateCurrencyDisplay();
      }
      if(k === '隐蔽度') {
        const newConcealment = parseInt(v.replace('%','')) || game.concealment;
        game.concealment = Math.max(0, Math.min(100, newConcealment));
      }
      if(k === '暴露程度') {
        // 检查暴露是否达到难度要求
        const requiredLevel = DIFFICULTY_SETTINGS[game.difficulty].exposureRequired;
        const achievedLevel = v;
        const levels = {partial:1, moderate:2, full:3};
        if(levels[achievedLevel] >= levels[requiredLevel] && game.tasks.main && !game.tasks.main.completed){
          game.tasks.main.completed = true;
          const rewardMultiplier = DIFFICULTY_SETTINGS[game.difficulty].rewardMultiplier;
          const expMultiplier = game.difficulty === 'hard' ? 1.2 : game.difficulty === 'easy' ? 0.9 : 1.0;
          const actualReward = Math.round(game.tasks.main.reward * rewardMultiplier);
          const actualExp = Math.round(game.tasks.main.exp * expMultiplier);
          game.currency += actualReward;
          game.exp += actualExp;
          updateCurrencyDisplay();
          toast(`主线完成！暴露程度${achievedLevel}达成+${actualReward}系统币 +${actualExp}经验`);
        }
      }
      if(k === '主线完成' && v === '是' && game.tasks.main && !game.tasks.main.completed){
        game.tasks.main.completed = true;
        const rewardMultiplier = DIFFICULTY_SETTINGS[game.difficulty].rewardMultiplier;
        const expMultiplier = game.difficulty === 'hard' ? 1.2 : game.difficulty === 'easy' ? 0.9 : 1.0;
        const actualReward = Math.round(game.tasks.main.reward * rewardMultiplier);
        const actualExp = Math.round(game.tasks.main.exp * expMultiplier);
        game.currency += actualReward;
        game.exp += actualExp;
        updateCurrencyDisplay();
        toast(`主线完成！+${actualReward}系统币 +${actualExp}经验`);
      }
      if(k === '支线完成' && v !== '无'){
        v.split(/[,，]/).forEach(num => {
          const i = parseInt(num) - 1;
          if(game.tasks.side[i] && !game.tasks.side[i].completed){
            game.tasks.side[i].completed = true;
            game.currency += Math.round(game.tasks.side[i].reward * 0.9);
            game.exp += Math.round(game.tasks.side[i].exp * 0.8);
            updateCurrencyDisplay();
            toast(`支线${num}完成！+${Math.round(game.tasks.side[i].reward*0.9)}系统币 +${Math.round(game.tasks.side[i].exp*0.8)}经验`);
          }
        });
      }
    });
  }

  // 全部完成则进入下一天
  if(game.tasks.main?.completed && game.tasks.side.every(s => s.completed)){
    game.day++;
    game.stamina = Math.min(100, game.stamina + 30);
    game.pee = Math.max(0, game.pee - 20);
    // 隐蔽度恢复
    game.concealment = Math.min(100, game.concealment + 15);
    genDailyTasks();
    toast(`第${game.day}天开始！新任务已刷新，隐蔽度恢复至${game.concealment}%`);
  }

  // 经验升级
  while(game.exp >= game.expMax){
    game.exp -= game.expMax;
    game.level++;
    game.expMax = 100 + (game.level - 1) * 50;
    game.currency += 60;
    updateCurrencyDisplay();
    game.concealment = Math.min(100, game.concealment + 10); // 升级增加隐蔽度
    toast(`升级至 Lv.${game.level}！+60系统币，隐蔽度+10%`);
  }
  
  // 状态警告
  if(game.pee >= 85) toast('尿意极高，有失禁风险！');
  if(game.stamina <= 15) toast('体力不支，可能晕厥！');
  if(game.danger >= 70) toast('危险值过高，极易发生意外！');
  if(game.concealment <= 30) toast('隐蔽度过低，更易被发现！');

  game.lastPlot = full.replace(/【状态】[^\n]*/g, '').trim();
  updateTime();
  quickSave();
  return choices;
}

function renderChoices(choices){
  if(choices && choices.length > 0){
    document.getElementById('choices-area').innerHTML = choices.map((c,i) =>
      `<div class="choice-item" onclick="doChoice(\`${c.replace(/`/g,'\\`')}\`)">选择${i+1}：${c}</div>`
    ).join('');
  } else {
    renderChoicesFromLast();
  }
}

// 添加难度影响开场剧情
async function generateOpening(){
  if(game.streaming) {
    toast('请等待当前操作完成');
    return;
  }
  game.streaming = true;
  
  const difficultyConfig = DIFFICULTY_SETTINGS[game.difficulty] || DIFFICULTY_SETTINGS.normal;
  let action = `系统刚刚在主角眼前激活，请生成完整开场剧情：
系统说明规则，明确告知当前难度为${game.difficulty}，要求暴露程度为${difficultyConfig.exposureRequired}级别。
清晰发布第一天主线任务：${game.tasks.main.title}（${game.tasks.main.description}）
主角的第一反应、心理描写、对暴露行为的期待与恐惧。
详细描写主角的身体特征和外貌。
要求出现至少两名NPC作为潜在观察者。
句子必须完整，不得吞字漏字。`;
  
  if(game.openingHint) action += ' 开场额外提示：' + game.openingHint;
  
  game.lastAction = action;
  document.getElementById('choices-area').innerHTML = '';
  const user = buildUserPrompt(action);
  const reader = await callStream(buildSystemPrompt(), user);
  if(!reader){ 
    game.streaming = false; 
    return; 
  }
  const full = await streamPlot(reader);
  const choices = parseAndUpdate(full);
  game.history.push({user, assistant:full});
  if(game.history.length > MAX_HISTORY) game.history.shift();
  renderChoices(choices);
  game.streaming = false;
}

async function doChoice(action){
  if(game.streaming) {
    toast('请等待当前剧情完成');
    return;
  }
  
  game.streaming = true;
  game.lastAction = action;
  
  // 清空选择区域
  document.getElementById('choices-area').innerHTML = '<div class="choice-item">生成剧情中...</div>';
  document.getElementById('custom-input').value = '';
  
  // 随机消耗体力，根据动作强度决定
  let staminaCost = randInt(2, 6);
  if(action.includes('大胆') || action.includes('完全') || action.includes('赤裸') || action.includes('露骨')) {
    staminaCost = randInt(5, 12);
  }
  game.stamina = Math.max(0, game.stamina - staminaCost);
  
  // 尿意自然增加
  game.pee = Math.min(100, game.pee + randInt(1, 4));
  
  // 隐蔽度降低
  const concealmentLoss = randInt(2, 4);
  game.concealment = Math.max(0, game.concealment - concealmentLoss);
  
  // 检查是否有装备加成
  const equippedItems = game.inventory.filter(i => i.equipped);
  let exposureBonus = 0;
  equippedItems.forEach(item => {
    const shopItem = SHOP_ITEMS.find(si => si.id === item.id);
    if(shopItem?.effect?.exposureBonus) {
      exposureBonus += shopItem.effect.exposureBonus;
    }
  });
  
  if(exposureBonus > 0) {
    toast(`装备提供了+${exposureBonus}暴露加成！`);
  }
  
  const user = buildUserPrompt(action);
  const reader = await callStream(buildSystemPrompt(), user);
  
  if(!reader){ 
    game.streaming = false; 
    setUIEnabled(true);
    return; 
  }
  
  try{
    const full = await streamPlot(reader);
    const choices = parseAndUpdate(full);
    
    // 添加历史记录
    game.history.push({user, assistant:full});
    if(game.history.length > MAX_HISTORY) game.history.shift();
    
    // 如果有有效的选择才渲染，否则显示刷新按钮
    if(choices && choices.length > 0){
      renderChoices(choices);
    }else{
      renderChoicesFromLast();
    }
  }catch(e){
    console.error('生成剧情失败:', e);
    toast('剧情生成失败，请重试');
    renderChoicesFromLast();
  }finally{
    game.streaming = false;
  }
}

function submitCustom(){
  const v = document.getElementById('custom-input').value.trim();
  if(!v){ 
    toast('请输入内容'); 
    return; 
  }
  
  if(game.streaming){
    toast('请等待当前剧情完成');
    return;
  }
  
  doChoice(v);
}

async function regeneratePlot(){
  if(game.streaming) {
    toast('请等待当前剧情完成');
    return;
  }
  
  if(!game.lastAction){ 
    await generateOpening(); 
    return; 
  }
  
  toast('正在刷新剧情...');
  game.streaming = true;
  
  // 清空选择区域
  document.getElementById('choices-area').innerHTML = '<div class="choice-item">生成剧情中...</div>';
  
  // 轻微消耗体力
  game.stamina = Math.max(0, game.stamina - randInt(1, 3));
  
  const user = buildUserPrompt(game.lastAction + '（请重新生成更加露骨完整的剧情，句子完整无吞字漏字，必须输出完整状态总结 + 三个完全不重复的选项）');
  const reader = await callStream(buildSystemPrompt(), user);
  
  if(!reader){ 
    game.streaming = false; 
    setUIEnabled(true);
    return; 
  }
  
  try{
    const full = await streamPlot(reader);
    const choices = parseAndUpdate(full);
    
    // 更新最后一条历史记录
    if(game.history.length > 0){
      game.history[game.history.length-1] = {user, assistant:full};
    }else{
      game.history.push({user, assistant:full});
    }
    
    if(choices && choices.length > 0){
      renderChoices(choices);
    }else{
      renderChoicesFromLast();
    }
  }catch(e){
    console.error('刷新剧情失败:', e);
    toast('刷新失败，请重试');
    renderChoicesFromLast();
  }finally{
    game.streaming = false;
  }
}

}

function randomizeExtra() {

function randomizeLocation() {

  const loc = locations[Math.floor(Math.random() * locations.length)];

function getRandomName(gender) {
  let pool = namePool.unisex;
  if (gender === '男') {
    pool = namePool.male;
  } else if (gender === '女') {
    pool = namePool.female;
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

// 添加全局取消请求的功能
window.addEventListener('beforeunload', function() {
  if(currentRequestController){
    currentRequestController.abort();
  }
});

// 添加键盘快捷键
document.addEventListener('keydown', function(e) {
  if(e.key === 'Escape' && currentRequestController){
    currentRequestController.abort();
    toast('请求已取消');
    setUIEnabled(true);
  }
});

// 辅助函数，用于解析AI回复时获取状态信息
function parseStateInfo(text) {
  const stateMatch = text.match(/【状态】([^\n]+)/);
  if (stateMatch) {
    return stateMatch[1].split('|').reduce((acc, p) => {
      const [k, v] = p.split('=').map(s => s.trim());
      if (k && v) acc[k] = v;
      return acc;
    }, {});
  }
  return {};
}

// 添加消息函数（辅助）
function addMessage(text, type = 'system') {
  const area = document.getElementById('plot-area');
  const oldText = area.textContent;
  const prefix = type === 'system' ? '[系统] ' : '';
  area.textContent = oldText + '\n\n' + prefix + text;
  area.scrollTop = area.scrollHeight;
}
